version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geocv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geocv
      POSTGRES_PASSWORD: geocv_password
      POSTGRES_DB: geocv_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocv -d geocv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geocv-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://geocv:geocv_password@postgres:5432/geocv_db
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY}
      - ROBOFLOW_MODEL=${ROBOFLOW_MODEL:-yolov8n-640}
      - ROUTING_API_KEY=${ROUTING_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geocv-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
